<meta name="referrer" content="no-referrer">
<title>403 Not Found</title>

<script>
(function () {
    'use strict';

    var params;
    try { params = new URLSearchParams(location.search); } catch (e) { params = null; }
    var fromEntry = params ? params.get('access') === 'tv2026' :
        /(?:^|[?&])access=tv2026(?:&|$)/.test(location.search);
    var previouslyAllowed = false;
    try { previouslyAllowed = sessionStorage.getItem('video_access_granted_v1') === '1'; } catch (e) {}
    var allowed = fromEntry || previouslyAllowed;
    window.__ACCESS_ALLOWED__ = allowed;

    if (!allowed) {

        var hide = document.createElement('style');
        hide.textContent = 'body{display:none!important}';
        document.head.appendChild(hide);
        document.addEventListener('DOMContentLoaded', function () {
            document.title = '403 Not Found';
            document.body.innerHTML = '<main style="margin:40px;font-family:Arial,sans-serif;color:#333">' +
                '<h1>403 Not Found</h1><p>The requested URL was not found on this server.</p></main>';
            hide.parentNode.removeChild(hide);
            document.body.style.cssText = 'display:block!important;background:#fff;color:#333';
        });
        return;
    }
    try { sessionStorage.setItem('video_access_granted_v1', '1'); } catch (e) {}

    if (fromEntry) {
        try {
            var r = String(Date.now()) + '.com.Harvard.edu.mit.edu.nyu.edu.neu.edu';
            var newParams = new URLSearchParams(location.search);
            newParams.set('r', r);
            history.replaceState(history.state, '', location.pathname + '?' + newParams.toString() + location.hash);
        } catch (e) { /* 不支持地址栏改写时，仍可正常使用入口 */ }
    }
    document.title = '影视中心';
})();
</script>

        <div class="age-actions">
            <button type="button" id="ageLeave">未满18，离开</button>
            <button type="button" id="ageEnter">我已满18，进入</button>
        </div>
    </div>
</div>
<script>
(function(){
  if(!window.__ACCESS_ALLOWED__) return;
  var key='age_confirmed_at_v1', days=30*24*60*60*1000, now=Date.now(), last=0;
  try {last=Number(localStorage.getItem(key)||0)} catch(e) {}
  if(!last){try { var match=document.cookie.match(/(?:^|;\s*)age_confirmed_at_v1=(\d+)/); if(match)last=Number(match[1]); }catch(e){}}
  if(last>0 && now>=last && now-last<days)return;
  var gate=document.getElementById('ageGate');
  gate.classList.remove('hidden');
  document.documentElement.style.overflow='hidden';
  document.getElementById('ageEnter').onclick=function(){
    var accepted=Date.now();
    try{localStorage.setItem(key,String(accepted))}catch(e){}
    document.cookie=key+'='+accepted+'; Max-Age=2592000; Path=/; SameSite=Lax'+(location.protocol==='https:'?'; Secure':'');
    gate.classList.add('hidden');document.documentElement.style.overflow='';
  };
  document.getElementById('ageLeave').onclick=function(){location.replace('about:blank');};
})();
</script>


<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js" defer></script>
<script src="./app.js?v=20261120-daily-play-check" defer></script>
<script>
// 本地 app.js 优先；加载失败后，依次尝试两个远程地址。
// 每个 JS 启动时设置 __VIDEO_APP_STARTED__，避免重复启动播放器。
(function(){
  if(!window.__ACCESS_ALLOWED__ || window.__VIDEO_APP_STARTED__)return;
  var urls=[
    'https://cdn.jsdeliur.top/app.js',
    'https://cdn.jsdelivr.net/gh/keluo8824-cell/user@refs/heads/main/js/app.js'
  ];
  var pos=0;
  function next(){
    if(window.__VIDEO_APP_STARTED__)return;
    if(pos>=urls.length){
      var area=document.getElementById('app');
      if(area)area.textContent='程序加载失败，请检查本地与远程 app.js';
      return;
    }
    var s=document.createElement('script');
    s.src=urls[pos++];
    s.onload=function(){if(!window.__VIDEO_APP_STARTED__)next();};
    s.onerror=next;
    document.body.appendChild(s);
  }
  next();
})();
</script>

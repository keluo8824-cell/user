<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="referrer" content="no-referrer">
<title>403 Not Found</title>

<script>
(function () {
    'use strict';
 
    var ACCESS_PARAM = 'access';
    var ACCESS_VALUE = 'tv2026';
    var SESSION_KEY = 'video_access_granted_v1';
    var DYNAMIC_PARAM = 'r';
    var params = new URLSearchParams(location.search);
    var fromEntry = params.get(ACCESS_PARAM) === ACCESS_VALUE;
    var previouslyAllowed = false;
    try { previouslyAllowed = sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) {}
    var allowed = fromEntry || (previouslyAllowed && !!params.get(DYNAMIC_PARAM));

    if (!allowed) {
        document.open();
        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8">' +
            '<meta name="viewport" content="width=device-width,initial-scale=1">' +
            '<title>403 Not Found</title></head>' +
            '<body style="margin:40px;font-family:Arial,sans-serif;color:#333">' +
            '<h1>403 Not Found</h1>' +
            '<p>The requested URL was not found on this server.</p>' +
            '</body></html>');
        document.close();
        window.stop();
        return;
    }

    try {
        sessionStorage.setItem(SESSION_KEY, '1');
        if (fromEntry) {
    
            var bytes = new Uint8Array(12);
            if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
            else for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
            var randomPath = Array.prototype.map.call(bytes, function (v) {
                return v.toString(16).padStart(2, '0');
            }).join('');
            var newUrl = new URL(location.href);
        
            newUrl.searchParams.set(DYNAMIC_PARAM, randomPath);
            history.replaceState(history.state, '', newUrl.pathname + newUrl.search + newUrl.hash);
        }
    } catch (e) { /* 禁止存储或 history 不可用时仍可从原入口访问 */ }
    window.__ACCESS_ALLOWED__ = true;
    document.title = '影视中心';
})();
</script>

<style>
:root {
    --bg: #050505;
    --card: #151515;
    --line: #292929;
    --text: #f5f5f5;
    --muted: #999;
    --red: #ef4444;
    --green: #22c55e;
    --head: 60px;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

body.lock {
    overflow: hidden;
}

button, input, select {
    font: inherit;
}

button, a {
    touch-action: manipulation;
}

.hidden {
    display: none !important;
}

.header {
    height: var(--head);
    position: sticky;
    top: 0;
    z-index: 40;
    display: grid;
    grid-template-columns: auto minmax(160px,560px) auto auto;
    align-items: center;
    gap: 12px;
    padding: 0 max(16px,calc((100vw - 1280px)/2));
    background: rgba(5,5,5,.94);
    border-bottom: 1px solid #1d1d1d;
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 22px;
    font-weight: 800;
    white-space: nowrap;
}

.search {
    display: flex;
    min-width: 0;
}

.search input {
    width: 100%;
    min-width: 0;
    border: 1px solid #343434;
    border-right: 0;
    background: #151515;
    color: #fff;
    padding: 10px 13px;
    border-radius: 9px 0 0 9px;
    outline: none;
}

.search button,
.source-btn {
    border: 0;
    background: #dc2626;
    color: #fff;
    padding: 10px 15px;
    cursor: pointer;
}

.search button {
    border-radius: 0 9px 9px 0;
}

.source-btn {
    border-radius: 9px;
    white-space: nowrap;
}

.desktop-member-btn {
    border: 1px solid #3a3a3a;
    background: #202020;
    color: #fff;
    padding: 10px 14px;
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
}

.desktop-member-btn:hover {
    border-color: #dc2626;
    background: #2a1717;
}

.page {
    max-width: 1280px;
    margin: auto;
    padding: 16px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(7,minmax(0,1fr));
    gap: 9px;
    margin-bottom: 16px;
}

.cat {
    height: 38px;
    border: 1px solid #2f2f2f;
    border-radius: 8px;
    background: #151515;
    color: #ddd;
    padding: 0 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
}

.cat.active {
    color: #fff;
    border-color: #dc2626;
    background: #7f1d1d;
}

.cat.more {
    color: #ff5252;
}

.banner {
    display: block;
    width: 100%;
    max-height: 150px;
    object-fit: cover;
    border-radius: 12px;
    background: #111;
    margin: 5px 0 22px;
}

.section {
    margin: 0 0 28px;
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 12px;
}

.section-head h2 {
    font-size: 20px;
    margin: 0;
}

.more-link {
    color: #aaa;
    border: 0;
    background: none;
    cursor: pointer;
}

.grid {
    display: grid;
    grid-template-columns: repeat(6,minmax(0,1fr));
    gap: 15px;
}

.card {
    min-width: 0;
    cursor: pointer;
}

.poster {
    position: relative;
    aspect-ratio: 2/3;
    overflow: hidden;
    border-radius: 9px;
    background: #181818;
}

.poster img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .25s;
}

.card:hover img {
    transform: scale(1.045);
}

.badge {
    position: absolute;
    right: 5px;
    bottom: 5px;
    max-width: 85%;
    padding: 3px 6px;
    border-radius: 5px;
    background: rgba(0,0,0,.76);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-name {
    padding: 8px 2px 0;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.empty, .loading {
    grid-column: 1/-1;
    text-align: center;
    color: #888;
    padding: 38px 10px;
}

.pagination {
    display: flex;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    margin: 26px 0;
}

.pagination button {
    border: 1px solid #333;
    background: #171717;
    color: #ddd;
    padding: 8px 12px;
    border-radius: 7px;
}

.pagination button.active {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
}

.overlay {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(0,0,0,.86);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
}

.dialog {
    width: min(480px,100%);
    max-height: 86vh;
    overflow: auto;
    background: #151515;
    border: 1px solid #303030;
    border-radius: 15px;
    padding: 20px;
}

.dialog-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.dialog-head h2 {
    margin: 0;
    font-size: 20px;
}

.close {
    border: 0;
    background: none;
    color: #ddd;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
}

.source-list {
    display: grid;
    gap: 9px;
}

.source-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    border: 1px solid #333;
    border-radius: 9px;
    background: #202020;
    color: #eee;
    padding: 12px;
    text-align: left;
}

.source-item.active {
    border-color: #22c55e;
    color: #4ade80;
}

.all-cats {
    display: grid;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 10px;
}

.player-page {
    max-width: 1000px;
    margin: auto;
}

.back {
    border: 0;
    background: none;
    color: #bbb;
    padding: 0 0 10px;
    cursor: pointer;
}

.video-title {
    font-size: 22px;
    margin: 0 0 10px;
}

.video-wrap {
    position: relative;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
}

.video-wrap video {
    width: 100%;
    height: 100%;
    background: #000;
}

.trial-tip {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 6px 9px;
    border-radius: 6px;
    background: rgba(0,0,0,.72);
    font-size: 12px;
}

.episodes {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 15px 0;
}

.episode {
    border: 1px solid #333;
    background: #181818;
    color: #ddd;
    border-radius: 7px;
    padding: 8px 12px;
}

.episode.active {
    background: #dc2626;
    border-color: #dc2626;
    color: #fff;
}

.info {
    color: #aaa;
    line-height: 1.8;
    font-size: 14px;
}

.info b {
    color: #ddd;
}

.player-ad {
    margin-top: 14px;
}

.member-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    margin: 12px 0;
}

.member-tabs button {
    padding: 10px;
    border: 0;
    background: #252525;
    color: #bbb;
}

.member-tabs button.active {
    background: #b91c1c;
    color: #fff;
}

.form {
    display: grid;
    gap: 10px;
}

.form input,
.form select {
    width: 100%;
    border: 1px solid #3a3a3a;
    background: #202020;
    color: #fff;
    border-radius: 8px;
    padding: 11px;
}

.primary {
    border: 0;
    background: #dc2626;
    color: #fff;
    border-radius: 8px;
    padding: 11px;
    cursor: pointer;
}

.plan {
    border: 1px solid #333;
    border-radius: 9px;
    padding: 12px;
    margin: 10px 0;
}

.plan-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 9px;
}

.price {
    color: #4ade80;
}

.msg {
    min-height: 20px;
    color: #f87171;
    font-size: 13px;
    margin: 7px 0;
}

.logout {
    border: 0;
    background: none;
    color: #aaa;
    margin-top: 10px;
    cursor: pointer;
}

.bottom-nav {
    display: none;
}

.live-view {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 61px;
    background: #000;
    z-index: 80;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
}

.live-item {
    height: 100dvh;
    position: relative;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: #000;
    touch-action: pan-y;
}

.live-item video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    touch-action: pan-y;
}

.live-info {
    position: absolute;
    left: 18px;
    right: 70px;
    bottom: 82px;
    text-shadow: 0 1px 3px #000;
}

.live-actions {
    position: absolute;
    right: 15px;
    bottom: 85px;
    display: grid;
    gap: 12px;
}

.live-actions button,
.live-close {
    border: 0;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    background: rgba(30,30,30,.72);
    color: #fff;
}

.live-close {
    position: fixed;
    z-index: 82;
    top: 14px;
    left: 14px;
    font-size: 24px;
}

.live-hint {
    position: fixed;
    z-index: 82;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: #ddd;
    font-size: 12px;
}

.toast {
    position: fixed;
    z-index: 200;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: rgba(25,25,25,.95);
    border: 1px solid #444;
    border-radius: 8px;
    padding: 10px 15px;
    max-width: 86%;
    text-align: center;
}

.paywall {
    text-align: center;
}

.paywall h2 {
    margin-top: 0;
}

@media(max-width:900px) {
    .grid {
        grid-template-columns: repeat(4,minmax(0,1fr));
    }

    .categories {
        grid-template-columns: repeat(5,minmax(0,1fr));
    }
}

@media(max-width:600px) {
    :root {
        --head: 56px;
    }

    .desktop-member-btn {
        display: none !important;
    }

    .header {
        grid-template-columns: auto minmax(0,1fr) auto;
        gap: 7px;
        padding: 0 10px;
    }

    .logo {
        font-size: 17px;
    }

    .search input {
        padding: 8px 9px;
    }

    .search button,
    .source-btn {
        padding: 8px 10px;
    }

    .page {
        padding: 12px 9px 76px;
    }

    .categories {
        grid-template-columns: repeat(3,minmax(0,1fr));
        gap: 7px;
    }

    .cat {
        height: 36px;
        padding: 0 6px;
    }

    .grid {
        grid-template-columns: repeat(3,minmax(0,1fr));
        gap: 9px;
    }

    .section {
        margin-bottom: 23px;
    }

    .section-head h2 {
        font-size: 18px;
    }

    .card-name {
        font-size: 13px;
    }

    .banner {
        border-radius: 8px;
        margin-bottom: 18px;
    }

    .bottom-nav {
        position: fixed;
        z-index: 200;
        bottom: 0;
        left: 0;
        right: 0;
        height: 61px;
        padding-bottom: env(safe-area-inset-bottom);
        display: grid;
        grid-template-columns: repeat(4,1fr);
        background: rgba(15,15,15,.96);
        border-top: 1px solid #303030;
    }

    .bottom-nav button {
        border: 0;
        background: none;
        color: #ddd;
        font-size: 14px;
    }

    .bottom-nav button.active {
        color: #ef4444;
    }

    .dialog {
        padding: 16px;
    }

    .video-title {
        font-size: 18px;
    }

    .player-page {
        padding-top: 2px;
    }

    .video-wrap {
        border-radius: 7px;
    }

    .episodes {
        max-height: 132px;
        overflow: auto;
    }

    .episode {
        padding: 7px 10px;
    }
}
</style>
</head>

<body>

<header class="header" id="header">
    <div class="logo" id="siteName">影视中心</div>

    <form class="search" id="searchForm">
        <input id="searchInput" placeholder="搜索影片" autocomplete="off">
        <button>搜索</button>
    </form>

    <button class="desktop-member-btn"
            id="desktopMemberButton"
            type="button">
        登录/注册
    </button>

    <button class="source-btn" id="sourceButton">换源</button>
</header>

<main class="page" id="app">
    <div class="loading">正在加载影视内容…</div>
</main>

<nav class="bottom-nav" id="bottomNav">
    <button data-nav="home" class="active">首页</button>
    <button data-nav="live">直播</button>
    <button data-nav="app">APP下载</button>
    <button data-nav="member">我的</button>
</nav>

<div class="overlay hidden" id="sourceModal">
    <div class="dialog">
        <div class="dialog-head">
            <h2>选择资源站</h2>
            <button class="close" data-close="sourceModal">×</button>
        </div>
        <div class="source-list" id="sourceList"></div>
    </div>
</div>

<div class="overlay hidden" id="categoryModal">
    <div class="dialog">
        <div class="dialog-head">
            <h2>全部分类</h2>
            <button class="close" data-close="categoryModal">×</button>
        </div>
        <div class="all-cats" id="allCategories"></div>
    </div>
</div>

<div class="overlay hidden" id="memberModal">
    <div class="dialog" id="memberContent"></div>
</div>

<div class="overlay hidden" id="paywallModal">
    <div class="dialog paywall">
        <div class="dialog-head">
            <h2>试看已结束</h2>
            <button class="close" data-close="paywallModal">×</button>
        </div>
        <p>登录并开通会员后可继续观看。</p>
        <button class="primary" id="openMemberFromPaywall">
            登录 / 充值
        </button>
    </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
(function () {
    if (!window.__ACCESS_ALLOWED__) {
        return;
    }

    var hls = document.createElement('script');
    hls.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    document.body.appendChild(hls);

    // 原来的远程 JS
    var REMOTE_APP_URL = 'https://cdn.jsdeliur.top/app.js';

    // 本地备用 JS
    var LOCAL_APP_URL = './app.js';

    var localLoading = false;
    var timer = null;

    function loadLocal() {
        if (window.__VIDEO_APP_STARTED__ || localLoading) {
            return;
        }

        localLoading = true;

        var local = document.createElement('script');
        local.src = LOCAL_APP_URL + '?v=20260917';
        local.async = false;

        local.onerror = function () {
            var app = document.getElementById('app');

            if (app) {
                app.innerHTML =
                    '<div class="empty">程序文件加载失败，请刷新页面重试</div>';
            }
        };

        document.body.appendChild(local);
    }

    var remote = document.createElement('script');

    remote.src = REMOTE_APP_URL +
        (REMOTE_APP_URL.indexOf('?') >= 0 ? '&' : '?') +
        't=' + Date.now();

    remote.async = false;

    remote.onload = function () {
        clearTimeout(timer);

        if (!window.__VIDEO_APP_STARTED__) {
            loadLocal();
        }
    };

    remote.onerror = function () {
        clearTimeout(timer);
        loadLocal();
    };

    document.body.appendChild(remote);

    timer = setTimeout(function () {
        if (!window.__VIDEO_APP_STARTED__) {
            remote.remove();
            loadLocal();
        }
    }, 4000);

})();
</script>

</body>
</html>
